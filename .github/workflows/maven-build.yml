name: Maven Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ДОБАВЬ ЭТУ СТРОКУ:
      - name: Clean Maven local repository
        run: rm -rf ~/.m2/repository

      - name: Build with Maven
        run: mvn -B package --file pom.xml
